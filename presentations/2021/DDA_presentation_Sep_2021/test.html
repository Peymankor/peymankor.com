- A **good decision** is an action we take that is consistent with the alternatives we perceive, the information we have, and the preferences we have.

--

## Example Case:

### Objective Function for Reservoir Optimization : 

--


`$$Obj \ Func(\mathbf{u})=J(\mathbf{u, G})= \sum_{k=1}^{K} \Bigg [\sum_{j=1}^{N_p}p_oq_{o,j,k}(\mathbf{u, G}) - \sum_{j=1}^{N_p}p_{wp}q_{wp,j,k}(\mathbf{u, G})- \sum_{j=1}^{N_{wi}}p_{wi}q_{wi,j,k}(\mathbf{u, G}) \Bigg]\frac{\Delta t_k}{(1+b)^{\frac{t_k}{D}}}$$`
--

-

--

`$$\color{blue} {\text{Robust Optimization}} \qquad \qquad \overline{J}(\mathbf{u}) = \frac{\sum_{re=1}^{n_e} J(\mathbf{u,G_{re}})}{n_e}$$`
--

- The `\(G\)` in the above Equation is "the geological model".

---

--

### Example Case

- Lets' say you are optimizing the well control problem with dimension, `\(d=10\)`.

--

- The number of 3D geological realizations is `\(n_e=100\)` and running each possible `\(u^*\)`in a commercial reservoir simulator, at each realization takes ~ 1 hour. Then time it takes to calculate `\(\overline{J}(u^*)\)` is ~ 100 hours.

--

- With 6 month CPU running time budget, the total available budget is to run is ~ 50.

--

- Availability of only 50 `\(\overline{J}(u^*)\)` evaluations is a small budget, considering the ten-dimensional optimization problem.

--

#### **&lt;span style="color:red"&gt; Problem:&lt;/span&gt;**&lt;span style="color:red"&gt;  `\(\overline{J}(u)\)` is an expensive function, meaning the # times we can evaluate it is severely limited. &lt;/span&gt;

- Problem:  **&lt;span style="color:red"&gt; 105,000 Reservoir Simulations Needed&lt;/span&gt;**
- Assume 1 hr forward run : `\(\frac{105000\times1}{24\times 360}\)` ~ 12 years

---

## How does the **&lt;span style="color:blue"&gt; industry&lt;/span&gt;** deal to make decision &lt;span style="color: red;"&gt;in a timely manner&lt;/span&gt;?

--

1) Work with a "one" geological model

`$$J(\mathbf{u, G})= \sum_{k=1}^{K} \Bigg [\sum_{j=1}^{N_p}p_oq_{o,j,k}(\mathbf{u, G}) - \sum_{j=1}^{N_p}p_{wp}q_{wp,j,k}(\mathbf{u, G})- \sum_{j=1}^{N_{wi}}p_{wi}q_{wi,j,k}(\mathbf{u, G}) \Bigg]\frac{\Delta t_k}{(1+b)^{\frac{t_k}{D}}}$$`
--

- **&lt;span style="color:red"&gt; Problem:&lt;/span&gt;** Ignoring uncertainty in geological model.

--

2) Calculate mean of geological realizations and optimize that one

`$$J(\mathbf{u, \overline{G}})= \sum_{k=1}^{K} \Bigg [\sum_{j=1}^{N_p}p_oq_{o,j,k}(\mathbf{u, \overline{G}}) - \sum_{j=1}^{N_p}p_{wp}q_{wp,j,k}(\mathbf{u, \overline{G}})- \sum_{j=1}^{N_{wi}}p_{wi}q_{wi,j,k}(\mathbf{u, \overline{G}}) \Bigg]\frac{\Delta t_k}{(1+b)^{\frac{t_k}{D}}}$$`
--

- **&lt;span style="color:red"&gt; Problem:&lt;/span&gt;** Problematic in non-linear, non-smooth forward model, like reservoir simulation.

--

3) Upscaling the fine-grid geological model to coarse grid
- **&lt;span style="color:red"&gt; Problem:&lt;/span&gt;** Inherently difficult to find representative coarse-gird model.

---

## How does  **&lt;span style="color:blue"&gt; academic research&lt;/span&gt;** deal to make decision &lt;span style="color: red;"&gt; in a timely manner&lt;/span&gt; with this problem?

--

#### Two general approaches have been introduced:

--

1) **&lt;span style="color:red"&gt; Targets the flow problem&lt;/span&gt;**

- Replacing the full-Physic (high-fidelity) flow simulation model with a reduced order model (lower-fidelity) 

--

- `$$J(\mathbf{u, G})= \sum_{k=1}^{K} \Bigg [\sum_{j=1}^{N_p}p_o \color{red}{q_{o,j,k}} (\mathbf{u, G}) - \sum_{j=1}^{N_p}p_{wp}\color{red}{q_{wp,j,k}}(\mathbf{u, G})- \sum_{j=1}^{N_{wi}}p_{wi}\color{red}{q_{wi,j,k}}(\mathbf{u, G}) \Bigg]\frac{\Delta t_k}{(1+b)^{\frac{t_k}{D}}}$$`

--

- Capacitance-Resistance Models, ML and DL-based Surrogates, Streamline-based Simulation,...(2017 Paper)

--

2)  **&lt;span style="color:red"&gt; Target the Dimension of Decision Variable/Number of Realizations&lt;/span&gt;**

--

- Trigonometric, polynomial approximation, and principal component analysis 
- Transfer `\(\mathbf{u}\)` from `\(D\)` dimension to `\(D^-\)`, where `\(D^- &lt; D\)`
- Or Transfer `\(n_e\)` from  `\(re\)` dimension to `\(re^-\)`, where `\(re^- &lt; re\)`

---

## Bayesian Optimization: This Work

--

- Neither Category (1) or (2)

--

- **&lt;span style="color:red"&gt; Category (3): make optimization algorithm more efficient than PSO, GA, EnOpt...&lt;/span&gt;**
--

- Efficiency means: as few as possible use of 
- `$$\overline{J}(\mathbf{u}) = \frac{\sum_{re=1}^{n_e} J(\mathbf{u,G_{re}})}{n_e}$$`
- Without sacrificing the near-optimal solution

--

##  Bayesian Optimization - How it works? 

--

- Build probabilistic Model out of initial points?

--

&lt;img src="test_files/figure-html/exampleshow-1.png" width="100%" style="display: block; margin: auto;" /&gt;

---

.pull-left[
### Equation

`$$\mathbb{E} \: [\mathbf{J(u)}]= m(\mathbf{u})$$` 
`$$\text{Cov} \: [\mathbf{J(u)}),J(\mathbf{J(u')}]= \kappa(\mathbf{u},\mathbf{u'})$$`
&lt;br /&gt;

`$$\begin{bmatrix}  {\bf {J_U}} \\  {\mathbf{J_{U_*}}} \end{bmatrix} \sim \mathcal{N} \begin{pmatrix} \begin{bmatrix}  {m(\mathbf{U})} \\  {m(\mathbf{U_*})} \end{bmatrix},\begin{bmatrix} {{\bf K}_{U,U}}  &amp; {{\bf K}_{U,U_*}} \\ {{\bf \mathbf{K}^\intercal}_{U,U_*}} &amp; {{\bf K}_{U_*,U_*} }\end{bmatrix}\end{pmatrix}$$`
{{content}}

]
--
&lt;br /&gt;
`$$\color{red}{p(\mathbf{J_{u_*}}|\mathbf{\mathcal{D},\theta^\ast})}= \:  \mathcal{N}(\mathbf{J_{u_*}}| \mathbf{\mu_{u_\ast}}, \mathbf{\sigma^2_{u_{\ast}}}) \\
\color{red}{\mathbf{\mu_{u_\ast}}}= \:  m(\mathbf{u_\ast}) +\mathbf{K}^\intercal_{U,u_*} \mathbf{K}^{-1}_{U,U}(\mathbf{J_U}-m(\mathbf{U})) \\
\textstyle \color{red}{\sigma^2_{\mathbf{u_{\ast}}}}= \:  \normalsize{\mathbf{\kappa}_{u_\ast,u_\ast}-\mathbf{K}^\intercal_{U,u_\ast}\mathbf{K}_{U,U}^{-1}\mathbf{K}_{U,u_\ast}}$$`

### Ensemble-based Optimization Method (EnOpt)

--

&lt;img src="enopt.png" width="80%" style="display: block; margin: auto;" /&gt;

---
.pull-left[
### EnOpt 
a) `$$\mathcal{MN}(\hat{\mathbf{u}}, \mathbf{C_u})$$` 

{{content}}

]
--

b) 
`$$\mathbf{u_1},\mathbf{u_2},\cdots,\mathbf{u_M} \sim \mathcal{MN}(\hat{\mathbf{u}}, \mathbf{C_u})$$`
`$$\overline{\mathbf{U}}=[\mathbf{u_1}-\hat{\mathbf{u}},\mathbf{u_2}-\hat{\mathbf{u}},\cdots,\mathbf{u_M}-\hat{\mathbf{u}}]^T$$` 
`$$\mathbf{j}=[J_1(u_1)-J_1(\hat{u}),\cdots,J_M(u_M)-J_M(\hat{u})]^T$$`
`$$\mathbf{C_{uJ}}=\frac{1}{M}(\overline{\mathbf{U}}^T\mathbf{j})$$`
`$$\mathbf{g}\approx\mathbf{C_{uJ}}$$`
{{content}}

--

c) `$$\hat{\mathbf{u}}_{l+1}=\hat{\mathbf{u}_l} + \alpha_l\frac{\mathbf{g}_l}{||\mathbf{g}_l||}$$`
--

.pull-right[

### BO
a) `$$\mathbf{U}= [\mathbf{u_1},\cdots,\mathbf{u_N}]$$`
`$$\mathbf{J_U}= \: [\mathbf{J(u_1)},\cdots,\mathbf{J(u_N)}]$$`
`$$\mathcal{D}= \: \{\mathbf{U},\mathbf{\mathbf{J_U}}\}$$`
`$$p(\mathbf{J_{U_*}}|\mathbf{\mathcal{D},\theta)}=\:  \mathcal{MN}(\mathbf{J_{U_*}| \mathbf{\mu_*},\textstyle \sum_{\ast}})$$`
{{content}}

]

--
b) `$$\mathbf{u}_*^{next}=\underset{\mathbf{u_*} \in \mathbf{U_*} }{\mathrm{argmax}} \; \alpha_{EI}(\mathbf{u_*};\theta^\ast,\mathcal{D})$$`
{{content}}
--
c) 
`$${\mathbf{\mu_\ast}}= \:  m(\mathbf{U_\ast}) +\mathbf{K}^\intercal_{U,U_*} \mathbf{K}^{-1}_{U,U}(\mathbf{J_U}-m(\mathbf{U})) \\
\textstyle \sum_{\ast}= \:  \normalsize{\mathbf{K}_{U_\ast,U_\ast}-\mathbf{K}^\intercal_{U,U_\ast}\mathbf{K}_{U,U}^{-1}\mathbf{K}_{U,U_\ast}}$$`

--
